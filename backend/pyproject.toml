[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "better-english-backend"
version = "0.1.0"
description = "FastAPI backend for Better English AI"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.8,<3", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
pronunciation = ["openpronounce[tts-piper]==0.3.0", "torch>=2.8,<3"]
stt = ["nemo_toolkit[asr]>=3,<4", "torch>=2.8,<3", "huggingface-hub>=0.34,<2"]
tts = ["pocket-tts>=3.3,<3.4", "torch>=2.8,<3", "huggingface-hub>=0.34,<2", "PyYAML>=6,<7"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
